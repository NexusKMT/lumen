interface:
  display_name: "Search MCPs"
  short_description: "Route and verify web research with Exa and Firecrawl"
  default_prompt: "Use $search-mcps to choose a healthy search provider, retrieve primary sources, and report verified evidence transparently."
dependencies:
  tools:
    - type: "mcp"
      value: "exa"
      description: "Semantic web search, page fetch, advanced search, and multi-step research"
      transport: "streamable_http"
      url: "https://mcp.exa.ai/mcp"
    - type: "mcp"
      value: "firecrawl"
      description: "Web search, extraction, parsing, developer and research indexes, and site workflows"
      transport: "streamable_http"
      url: "https://mcp.firecrawl.dev/v2/mcp"
