interface:
  display_name: "Lumen"
  short_description: "Illuminate and verify current web evidence"
  default_prompt: "Use $lumen to discover authoritative sources, retrieve primary evidence, and verify material claims transparently."
dependencies:
  tools:
    - type: "mcp"
      value: "exa"
      description: "Semantic web search, page fetch, advanced search, and multi-step research"
      transport: "streamable_http"
      url: "https://mcp.exa.ai/mcp"
    - type: "mcp"
      value: "firecrawl"
      description: "Web search, extraction, parsing, developer and research indexes, and site workflows"
      transport: "streamable_http"
      url: "https://mcp.firecrawl.dev/v2/mcp"
